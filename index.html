<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Finder | Распознавание музыки</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --primary: #6c5ce7;
            --bg: #0f0c29;
            --glass: rgba(255, 255, 255, 0.1);
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .container {
            background: var(--glass);
            backdrop-filter: blur(10px);
            padding: 2rem;
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
            text-align: center;
            width: 90%;
            max-width: 400px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        h1 { margin-bottom: 1.5rem; font-weight: 300; }

        .record-btn {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            border: none;
            background: var(--primary);
            color: white;
            font-size: 2rem;
            cursor: pointer;
            transition: transform 0.3s, box-shadow 0.3s;
            margin-bottom: 1rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .record-btn:hover { transform: scale(1.1); }
        .record-btn.active {
            animation: pulse 1.5s infinite;
            background: #ff7675;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(255, 118, 117, 0.7); }
            70% { box-shadow: 0 0 0 20px rgba(255, 118, 117, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 118, 117, 0); }
        }

        #result {
            margin-top: 1.5rem;
            padding: 1rem;
            border-radius: 10px;
            background: rgba(0,0,0,0.2);
            display: none;
        }

        .status { font-size: 0.9rem; color: #a29bfe; margin-top: 10px; }
    </style>
</head>
<body>

<div class="container">
    <h1>Music Finder</h1>
    <p>Нажмите на кнопку, чтобы распознать музыку вокруг вас</p>
    
    <button id="recordBtn" class="record-btn">
        <i class="fas fa-microphone"></i>
    </button>
    
    <div id="status" class="status">Готов к работе</div>

    <div id="result">
        <h3 id="trackTitle">Название трека</h3>
        <p id="trackArtist">Исполнитель</p>
    </div>
</div>

<script>
    const recordBtn = document.getElementById('recordBtn');
    const statusText = document.getElementById('status');
    const resultDiv = document.getElementById('result');

    // ВАЖНО: Для работы нужен API Key от AudD.io
    const API_KEY = "ВАШ_API_KEY_ЗДЕСЬ"; 

    recordBtn.addEventListener('click', async () => {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            const mediaRecorder = new MediaRecorder(stream);
            const chunks = [];

            mediaRecorder.ondataavailable = (e) => chunks.push(e.data);
            mediaRecorder.onstop = async () => {
                const blob = new Blob(chunks, { type: 'audio/wav' });
                await sendToApi(blob);
            };

            // Записываем 5 секунд
            mediaRecorder.start();
            recordBtn.classList.add('active');
            statusText.innerText = "Слушаю...";

            setTimeout(() => {
                mediaRecorder.stop();
                recordBtn.classList.remove('active');
                statusText.innerText = "Обработка...";
            }, 5000);

        } catch (err) {
            alert("Ошибка доступа к микрофону: " + err);
        }
    });

    async function sendToApi(audioBlob) {
        const formData = new FormData();
        formData.append('file', audioBlob);
        formData.append('api_token', API_KEY);
        formData.append('return', 'apple_music,spotify');

        try {
            const response = await fetch('https://api.audd.io/', {
                method: 'POST',
                body: formData
            });
            const data = await response.json();

            if (data.result) {
                resultDiv.style.display = 'block';
                document.getElementById('trackTitle').innerText = data.result.title;
                document.getElementById('trackArtist').innerText = data.result.artist;
                statusText.innerText = "Найдено!";
            } else {
                statusText.innerText = "Музыка не найдена";
            }
        } catch (error) {
            statusText.innerText = "Ошибка сервера";
            console.error(error);
        }
    }
</script>

</body>
</html>
